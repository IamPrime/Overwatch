<!DOCTYPE html> 
<html lang="en">
<head>
  <title> Overwatch - Food & Recipe Analysis </title>
  <meta charset="UTF-8">
  <meta name="description" content="Food & Recipe Analysis">
  <meta name="keywords" content="AI, Analysis, Food, Wolfram Alpha">
  <meta name="author" content="I_am_Prime">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script type="text/javascript" src="overwatch.js"></script>
  <link rel="stylesheet" href="overwatch.css">
  <link href="https://fonts.googleapis.com/css2?family=Sansita+Swashed&family=Ubuntu:wght@400&display=swap" rel="stylesheet">
</head>

<body>

  <div class="wrapper">
    <h1>What are you eating?</h1>
    <h2>Snap a photo of your food & upload for a nutritional breakdown.</h2>

    <form action="#">
      <input type="file" id="filename" placeholder="Filename" size="100"/>
      <button type="button" onclick="predict_click($('#filename').val(), 'file'); return false;">Analyse My Nutrition!!</button>
    </form>

    <div id="predictions">
      <div class="food-photo">
        <div class="step"><span>1</span> Upload a Photo</div>
      </div>
      <div class="nutrition">
        <div class="step"><span>2</span> Nutrition Analysis</div>
        <div id="concepts"></div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="powered-by">
      <p>Inspired by <a href="https://devpost.com/software/munch-emsv0u">Munch</a>.&nbsp;&nbsp; Nutrition data by Wolfram Alpha.</p>
    </div>
  </footer>
  
</body>
</html>
